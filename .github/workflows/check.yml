name: Workflow Runner Policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
      - name: Checkout fleet policy
        uses: actions/checkout@v4
        with:
          repository: joshevanlee-org/fleet-ci
          path: .fleet-ci
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .fleet-ci/scripts/check-workflow-policy.mjs --root-directory "$GITHUB_WORKSPACE"
